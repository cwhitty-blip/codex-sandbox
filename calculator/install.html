<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f2f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Calculator"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-v36.svg"><title>Install Calculator</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f2f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 24px) 18px calc(env(safe-area-inset-bottom) + 24px)}main{max-width:520px;margin:0 auto}.icon{width:82px;height:82px;border-radius:19px;background:#111;color:#ff9f0a;display:grid;place-items:center;font-size:42px;margin:14px 0 18px;box-shadow:0 6px 22px #0002}h1{font-size:31px;letter-spacing:-.6px;margin:0 0 8px}p{color:#555;line-height:1.5}.card{background:#fff;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 8px 26px #0000000d}.step{display:flex;gap:12px;margin:13px 0}.n{width:28px;height:28px;border-radius:50%;background:#0a84ff;color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 auto}.btn{display:block;width:100%;border:0;border-radius:14px;background:#0a84ff;color:#fff;padding:14px;font:800 16px inherit;margin-top:12px}.hide{background:#e5e5ea;color:#111}.small{font-size:12px;color:#777}</style></head><body><main><div class="icon">⌗</div><h1>Calculator</h1><p>Add Calculator v38 to your iPhone Home Screen so it opens like an app.</p><div class="card"><div class="step"><div class="n">1</div><div>In Safari, tap the <b>Share</b> button.</div></div><div class="step"><div class="n">2</div><div>Tap <b>Add to Home Screen</b>.</div></div><div class="step"><div class="n">3</div><div>Make sure <b>Open as Web App</b> is enabled, then tap <b>Add</b>.</div></div><p class="small">After it is on your Home Screen, open it from the
