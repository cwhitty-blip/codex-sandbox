<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Calculator</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
button,input,textarea{font:inherit}button{border:0}.screen{position:fixed;inset:0;display:none;overflow:auto;background:#000}.screen.active{display:block}
#calc{padding:env(safe-area-inset-top) 14px calc(14px + env(safe-area-inset-bottom));flex-direction:column;justify-content:flex-end}#calc.active{display:flex}
.calcbox{width:min(100%,430px);margin:0 auto}.display{height:150px;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 12px 18px;font-weight:300;font-size:clamp(62px,18vw,92px);line-height:1;white-space:nowrap;overflow:hidden}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.key{aspect-ratio:1;border-radius:50%;background:#333;color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center}.key:active{filter:brightness(1.35)}.light{background:#a5a5a5;color:#000}.orange{background:#ff9f0a}.zero{grid-column:span 2;aspect-ratio:auto;border-radius:999px;justify-content:flex-start;padding-left:28px}
.homebg{min-height:100%;padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 28px);background:linear-gradient(160deg,#101522,#1f2840 50%,#111827)}.secondbg{background:linear-gradient(160deg,#1a071e,#31143a 50%,#120b20)}.deepbg{background:linear-gradient(160deg,#071c16,#0d3b2f 55%,#05110d)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.top h1{margin:0;font-size:28px}.ghost{background:#ffffff20;color:#fff;padding:10px 14px;border-radius:14px;font-weight:700}.subtle{font-size:12px;color:#ffffffaa;margin:-16px 0 24px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 14px}.appbtn{background:none;color:#fff;padding:0;text-align:center;min-width:0}.ico{width:min(15.5vw,66px);height:min(15.5vw,66px);border-radius:16px;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;font-size:31px;box-shadow:0 4px 16px #0005}.nm{font-size:12px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store{background:linear-gradient(145deg,#2d7dff,#48b8ff)}.notes{background:linear-gradient(#ffe769 0 24%,#fff7d3 24%)}.photos{background:linear-gradient(145deg,#ff5e78,#ffb33e 45%,#6fd65b 70%,#4b8dff)}.browser{background:linear-gradient(145deg,#5bd4ff,#1267ff)}.game{background:linear-gradient(145deg,#9a5cff,#4c25b7)}.space{background:linear-gradient(145deg,#242424,#656565)}.files{background:linear-gradient(145deg,#5bb7ff,#1760dd)}.sketch{background:linear-gradient(145deg,#ff7d4d,#ffca52)}.clock{background:linear-gradient(145deg,#111,#555)}.deep{background:linear-gradient(145deg,#0e3f31,#1b8c6b)}
.page{min-height:100%;background:#f2f2f7;color:#111;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 18px)}.head{display:flex;align-items:center;gap:10px;position:sticky;top:0;padding:8px 0 13px;background:#f2f2f7;z-index:2}.back{background:#e0e0e7;color:#0a66ff;border-radius:12px;padding:9px 12px;font-weight:800}.head h2{margin:0;font-size:24px}.card{background:#fff;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 1px 3px #0001}.row{display:flex;align-items:center;gap:12px}.row .ico{width:58px;height:58px;flex:0 0 58px;margin:0}.grow{flex:1;min-width:0}.grow strong{display:block;font-size:17px}.grow small{display:block;color:#777;margin-top:3px}.get{background:#e9f1ff;color:#0565e8;padding:8px 14px;border-radius:999px;font-weight:800}.get.on{background:#eee;color:#666}
.note{width:100%;height:62vh;border:0;background:#fff;color:#111;border-radius:18px;padding:16px;font-size:18px;resize:none;outline:none}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.tools label,.toolbtn{background:#0a66ff;color:#fff;padding:11px 14px;border-radius:13px;font-weight:800}.toolbtn.gray{background:#777}.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.pics img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;background:#ddd}.muted{color:#777;font-size:13px}
.filelist{display:flex;flex-direction:column;gap:9px}.fileitem{background:#fff;border-radius:15px;padding:12px;display:flex;align-items:center;gap:10px}.filebadge{width:42px;height:42px;border-radius:11px;background:#e7f1ff;display:flex;align-items:center;justify-content:center;font-size:22px}.filemeta{flex:1;min-width:0}.filemeta strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.filemeta small{color:#777}.fileactions{display:flex;gap:6px}.smallbtn{background:#e8e8ed;color:#111;padding:8px 10px;border-radius:10px;font-weight:700}
.url{display:flex;gap:8px;margin-bottom:10px}.url input{flex:1;border:1px solid #ccc;background:#fff;color:#111;border-radius:12px;padding:11px}.go,.primary,.reset{background:#0a66ff;color:#fff;border-radius:13px;font-weight:800}.go{padding:0 15px}iframe{width:100%;height:68vh;border:0;background:#fff;border-radius:16px}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:350px;margin:35px auto 15px}.ttt button{aspect-ratio:1;background:#fff;border-radius:18px;font-size:54px;color:#111;box-shadow:0 1px 4px #0002}.status{text-align:center;font-weight:700;min-height:24px}.reset{display:block;margin:18px auto;padding:10px 16px}
.lockcard{max-width:420px;margin:18vh auto 0;background:#fff;padding:22px;border-radius:22px;text-align:center}.lockcard input{width:100%;padding:14px;border:1px solid #bbb;border-radius:12px;font-size:22px;text-align:center;color:#111;background:#fff;margin:10px 0}.primary{width:100%;padding:13px}
.canvaswrap{background:#fff;border-radius:18px;padding:10px;box-shadow:0 1px 3px #0001}.canvaswrap canvas{display:block;width:100%;height:58vh;background:#fff;border-radius:12px;touch-action:none}.clockface{text-align:center;font-size:58px;font-weight:300;padding:70px 10px 10px}.clockdate{text-align:center;color:#777;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:10px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:20;font-weight:700;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main id="calc" class="screen active"><div class="calcbox"><div id="disp" class="display">0</div><div class="keys">
<button class="key light" data-a="clear">AC</button><button class="key light" data-v="+/-">+/−</button><button class="key light" data-v="%">%</button><button class="key orange" data-v="÷">÷</button>
<button class="key" data-v="7">7</button><button class="key" data-v="8">8</button><button class="key" data-v="9">9</button><button class="key orange" data-v="×">×</button>
<button class="key" data-v="4">4</button><button class="key" data-v="5">5</button><button class="key" data-v="6">6</button><button class="key orange" data-v="−">−</button>
<button class="key" data-v="1">1</button><button class="key" data-v="2">2</button><button class="key" data-v="3">3</button><button class="key orange" data-v="+">+</button>
<button class="key zero" data-v="0">0</button><button class="key" data-v=".">.</button><button class="key orange" data-a="eq">=</button>
</div></div></main>
<section id="home" class="screen"><div class="homebg"><div class="top"><h1>Home</h1><button class="ghost" data-lock>Lock</button></div><div class="subtle">Private apps stay inside Calculator on this device.</div><div id="grid" class="grid"></div></div></section>
<section id="app" class="screen"></section><section id="second" class="screen"></section><section id="deep" class="screen"></section><div id="toast" class="toast"></div>
<script>
(()=>{
const PASS_HASH='3c94c0b1c3ce114c39b16272a86b47e0ed7de7c13a67b6b93eff0130ccd408f9';
const $=s=>document.querySelector(s),calc=$('#calc'),home=$('#home'),app=$('#app'),second=$('#second'),deep=$('#deep'),disp=$('#disp');let expr='';
const defs={notes:{name:'Notes',icon:'📝',cls:'notes',desc:'Private notes saved on this phone'},photos:{name:'Photos',icon:'🌈',cls:'photos',desc:'Pictures stored inside Calculator'},files:{name:'Files',icon:'📁',cls:'files',desc:'Private files saved on this device'},sketch:{name:'Sketch',icon:'✎',cls:'sketch',desc:'Draw and save private sketches'},browser:{name:'Browser',icon:'🧭',cls:'browser',desc:'A simple browser window'},game:{name:'Tic-Tac-Toe',icon:'✕',cls:'game',desc:'A small game'},clock:{name:'Clock',icon:'◷',cls:'clock',desc:'Clock and date'},space:{name:'Second Space',icon:'◉',cls:'space',desc:'Another locked home screen with its own apps'}};
const defs2={notes2:{name:'Notes',icon:'📝',cls:'notes',desc:'Notes only inside Second Space'},photos2:{name:'Photos',icon:'🌈',cls:'photos',desc:'Photos only inside Second Space'},files2:{name:'Files',icon:'📁',cls:'files',desc:'Files only inside Second Space'},sketch2:{name:'Sketch',icon:'✎',cls:'sketch',desc:'Sketch inside Second Space'},game2:{name:'Tic-Tac-Toe',icon:'✕',cls:'game',desc:'A game inside Second Space'},deep:{name:'Deep Space',icon:'◆',cls:'deep',desc:'A third locked space inside Second Space'}};
const defs3={notes3:{name:'Notes',icon:'📝',cls:'notes',desc:'Notes only inside Deep Space'},files3:{name:'Files',icon:'📁',cls:'files',desc:'Files only inside Deep Space'},sketch3:{name:'Sketch',icon:'✎',cls:'sketch',desc:'Sketch only inside Deep Space'},game3:{name:'Tic-Tac-Toe',icon:'✕',cls:'game',desc:'A game inside Deep Space'}};
const installed=(k,d)=>{try{let x=JSON.parse(localStorage.getItem(k));return Array.isArray(x)?x.filter(i=>d[i]):[]}catch{return[]}},saveInstalled=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
if(!localStorage.getItem('installed'))saveInstalled('installed',['notes','photos','files','sketch','game','space']);if(!localStorage.getItem('second-installed'))saveInstalled('second-installed',['notes2','deep']);if(!localStorage.getItem('deep-installed'))saveInstalled('deep-installed',['notes3']);
function show(el){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));el.classList.add('active')}function lock(){expr='';disp.textContent='0';app.innerHTML='';second.innerHTML='';deep.innerHTML='';show(calc)}document.addEventListener('click',e=>{if(e.target.closest('[data-lock]'))lock()});document.addEventListener('visibilitychange',()=>{if(document.hidden)lock()});window.addEventListener('pagehide',lock);
async function sha(t){let h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function evalCalc(){try{let s=expr.replace(/−/g,'-').replace(/×/g,'*').replace(/÷/g,'/').replace(/%/g,'/100');if(!/^[0-9+\-*/.() ]+$/.test(s))throw 0;let n=Function('"use strict";return ('+s+')')();if(!Number.isFinite(n))throw 0;expr=String(Math.round((n+Number.EPSILON)*1e10)/1e10);disp.textContent=expr}catch{expr='';disp.textContent='Error'}}
calc.onclick=async e=>{let b=e.target.closest('.key');if(!b)return;if(b.dataset.a==='clear'){expr='';disp.textContent='0';return}if(b.dataset.a==='eq'){if(await sha(expr)===PASS_HASH){expr='';disp.textContent='0';renderHome();show(home)}else evalCalc();return}let v=b.dataset.v;if(v==='+/-'){if(expr&&/^-?\d*\.?\d+$/.test(expr.replace(/−/g,'-')))expr=expr.startsWith('−')?expr.slice(1):'−'+expr}else if(expr.length<30)expr+=v;disp.textContent=expr||'0'};
function icon(d,fn){let b=document.createElement('button');b.className='appbtn';b.innerHTML=`<span class="ico ${d.cls}">${d.icon}</span><span class="nm"></span>`;b.querySelector('.nm').textContent=d.name;b.onclick=fn;return b}
function renderHome(){let g=$('#grid');g.innerHTML='';g.append(icon({name:'App Store',icon:'A',cls:'store'},()=>store(1)));installed('installed',defs).forEach(id=>g.append(icon(defs[id],()=>openApp(id,1))))}
function header(title,back){let h=document.createElement('div');h.className='head';let b=document.createElement('button');b.className='back';b.textContent='‹ Home';b.onclick=back;let t=document.createElement('h2');t.textContent=title;h.append(b,t);return h}function shell(which,title,back){which.innerHTML='';let p=document.createElement('div');p.className='page';p.append(header(title,back));which.append(p);show(which);return p}function toast(m){let t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1100)}
function layerInfo(layer){if(layer===1)return{defs,key:'installed',el:app,back:()=>{renderHome();show(home)}};if(layer===2)return{defs:defs2,key:'second-installed',el:second,back:renderSecond};return{defs:defs3,key:'deep-installed',el:deep,back:renderDeep}}
function store(layer){let L=layerInfo(layer),p=shell(L.el,'Private App Store',L.back);Object.entries(L.defs).forEach(([id,x])=>{let c=document.createElement('div');c.className='card row';let i=document.createElement('div');i.className=`ico ${x.cls}`;i.textContent=x.icon;let g=document.createElement('div');g.className='grow';g.innerHTML='<strong></strong><small></small>';g.querySelector('strong').textContent=x.name;g.querySelector('small').textContent=x.desc;let b=document.createElement('button');b.className='get';function r(){let a=installed(L.key,L.defs),on=a.includes(id);b.textContent=on?'REMOVE':'GET';b.classList.toggle('on',on)}b.onclick=()=>{let a=installed(L.key,L.defs);if(a.includes(id)){a=a.filter(y=>y!==id);toast('Removed')}else{a.push(id);toast('Installed')}saveInstalled(L.key,a);r()};r();c.append(i,g,b);p.append(c)})}
function openApp(id,layer){if(id==='space')return openSecond();if(id==='deep')return openDeep();if(id.startsWith('notes'))return notes(layer);if(id.startsWith('photos'))return photos(layer);if(id.startsWith('files'))return files(layer);if(id.startsWith('sketch'))return sketch(layer);if(id==='browser')return browser();if(id.startsWith('game'))return game(layer);if(id==='clock')return clock()}
function backFor(layer){return layer===1?()=>{renderHome();show(home)}:layer===2?renderSecond:renderDeep}function elFor(layer){return layer===1?app:layer===2?second:deep}
function notes(layer){let k='note-'+layer,p=shell(elFor(layer),'Notes',backFor(layer)),ta=document.createElement('textarea');ta.className='note';ta.placeholder='Write something…';ta.value=localStorage.getItem(k)||'';ta.oninput=()=>localStorage.setItem(k,ta.value);p.append(ta)}
function photoList(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch{return[]}}function photos(layer){let k='pics-'+layer,p=shell(elFor(layer),'Photos',backFor(layer)),tools=document.createElement('div');tools.className='tools';let label=document.createElement('label');label.textContent='Add Photos';let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;inp.hidden=true;label.append(inp);let info=document.createElement('span');info.className='muted';info.textContent='Stored on this device';tools.append(label,info);let grid=document.createElement('div');grid.className='pics';function render(){grid.innerHTML='';photoList(k).forEach(src=>{let im=document.createElement('img');im.src=src;grid.append(im)})}inp.onchange=async()=>{let a=photoList(k);for(let f of inp.files){if(a.length>=18)break;let src=await new Promise(res=>{let fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(f)});a.unshift(src)}try{localStorage.setItem(k,JSON.stringify(a));render()}catch{toast('Storage is full')}};p.append(tools,grid);render()}
function db(){return new Promise((res,rej)=>{let r=indexedDB.open('calculator-private-v2',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function fileAll(layer){let d=await db();return new Promise((res,rej)=>{let tx=d.transaction('files','readonly'),r=tx.objectStore('files').getAll();r.onsuccess=()=>res(r.result.filter(x=>x.layer===layer).sort((a,b)=>b.time-a.time));r.onerror=()=>rej(r.error)})}
async function fileSave(layer,f){let d=await db();return new Promise((res,rej)=>{let tx=d.transaction('files','readwrite');tx.objectStore('files').put({id:crypto.randomUUID(),layer,name:f.name,type:f.type||'application/octet-stream',size:f.size,time:Date.now(),blob:f});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function fileDelete(id){let d=await db();return new Promise((res,rej)=>{let tx=d.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function fmtBytes(n){if(n<1024)return n+' B';if(n<1048576)return Math.round(n/102.4)/10+' KB';return Math.round(n/104857.6)/10+' MB'}
async function files(layer){let p=shell(elFor(layer),'Files',backFor(layer)),tools=document.createElement('div');tools.className='tools';let label=document.createElement('label');label.textContent='Add Files';let inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.hidden=true;label.append(inp);let info=document.createElement('span');info.className='muted';info.textContent='Saved only on this device';tools.append(label,info);let list=document.createElement('div');list.className='filelist';p.append(tools,list);async function render(){list.innerHTML='';let rows=await fileAll(layer);if(!rows.length){let c=document.createElement('div');c.className='card muted';c.textContent='No files yet.';list.append(c);return}rows.forEach(x=>{let r=document.createElement('div');r.className='fileitem';let badge=document.createElement('div');badge.className='filebadge';badge.textContent='📄';let meta=document.createElement('div');meta.className='filemeta';let st=document.createElement('strong');st.textContent=x.name;let sm=document.createElement('small');sm.textContent=fmtBytes(x.size);meta.append(st,sm);let acts=document.createElement('div');acts.className='fileactions';let open=document.createElement('button');open.className='smallbtn';open.textContent='Open';open.onclick=()=>{let u=URL.createObjectURL(x.blob);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),30000)};let del=document.createElement('button');del.className='smallbtn';del.textContent='Delete';del.onclick=async()=>{await fileDelete(x.id);render()};acts.append(open,del);r.append(badge,meta,acts);list.append(r)})}inp.onchange=async()=>{for(let f of inp.files)try{await fileSave(layer,f)}catch{toast('Could not save file')}inp.value='';render()};render()}
function sketch(layer){let p=shell(elFor(layer),'Sketch',backFor(layer)),tools=document.createElement('div');tools.className='tools',clear=document.createElement('button');clear.className='toolbtn gray';clear.textContent='Clear',save=document.createElement('button');save.className='toolbtn';save.textContent='Save Sketch';tools.append(clear,save);let wrap=document.createElement('div');wrap.className='canvaswrap',c=document.createElement('canvas');wrap.append(c);p.append(tools,wrap);let ctx=c.getContext('2d'),drawing=false,last=null;function size(){let r=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=Math.floor(r.width*dpr);c.height=Math.floor(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle='#111'}requestAnimationFrame(size);function pt(e){let r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}function start(e){drawing=true;last=pt(e);e.preventDefault()}function move(e){if(!drawing)return;let q=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();last=q;e.preventDefault()}function end(){drawing=false;last=null}c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);clear.onclick=()=>ctx.clearRect(0,0,c.width,c.height);save.onclick=()=>{localStorage.setItem('sketch-'+layer,c.toDataURL('image/png'));toast('Sketch saved')};let old=localStorage.getItem('sketch-'+layer);if(old){let im=new Image();im.onload=()=>requestAnimationFrame(()=>ctx.drawImage(im,0,0,c.getBoundingClientRect().width,c.getBoundingClientRect().height));im.src=old}}
function browser(){let p=shell(app,'Browser',()=>{renderHome();show(home)}),bar=document.createElement('div');bar.className='url';let inp=document.createElement('input');inp.placeholder='Search or enter website';let go=document.createElement('button');go.className='go';go.textContent='Go';bar.append(inp,go);let f=document.createElement('iframe');f.setAttribute('sandbox','allow-forms allow-scripts allow-same-origin allow-popups');f.src='https://www.google.com/webhp?igu=1';function nav(){let v=inp.value.trim();if(!v)return;if(!/^https?:\/\//i.test(v))v=v.includes('.')&&!v.includes(' ')?'https://'+v:'https://www.google.com/search?q='+encodeURIComponent(v);f.src=v}go.onclick=nav;inp.onkeydown=e=>{if(e.key==='Enter')nav()};p.append(bar,f)}
function game(layer){let p=shell(elFor(layer),'Tic-Tac-Toe',backFor(layer)),board=document.createElement('div');board.className='ttt';let st=document.createElement('div');st.className='status',cells=Array(9).fill(''),turn='X',done=false,wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function r(){board.innerHTML='';cells.forEach((v,i)=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(done||cells[i])return;cells[i]=turn;if(wins.some(a=>a.every(j=>cells[j]===turn))){done=true;st.textContent=turn+' wins!'}else if(cells.every(Boolean)){done=true;st.textContent='Draw'}else{turn=turn==='X'?'O':'X';st.textContent=turn+"'s turn"}r()};board.append(b)})}st.textContent="X's turn";r();let reset=document.createElement('button');reset.className='reset';reset.textContent='New Game';reset.onclick=()=>{cells=Array(9).fill('');turn='X';done=false;st.textContent="X's turn";r()};p.append(board,st,reset)}
function clock(){let p=shell(app,'Clock',()=>{renderHome();show(home)}),face=document.createElement('div');face.className='clockface',date=document.createElement('div');date.className='clockdate';p.append(face,date);function tick(){let d=new Date();face.textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});date.textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'})}tick();let t=setInterval(tick,1000);let obs=new MutationObserver(()=>{if(!app.classList.contains('active')){clearInterval(t);obs.disconnect()}});obs.observe(app,{attributes:true,attributeFilter:['class']})}
async function pinGate(storageKey,title,subtitle,onUnlock,back){let stored=localStorage.getItem(storageKey),p=shell(storageKey.startsWith('deep')?deep:second,title,back),c=document.createElement('div');c.className='lockcard';let h=document.createElement('h2');h.textContent=stored?title:'Create '+title+' PIN';let tip=document.createElement('p');tip.className='muted';tip.textContent=stored?subtitle:'Choose at least 4 digits for this space.';let inp=document.createElement('input');inp.type='password';inp.inputMode='numeric';inp.maxLength=10;inp.placeholder=stored?'PIN':'New PIN';let b=document.createElement('button');b.className='primary';b.textContent=stored?'Unlock':'Create PIN';b.onclick=async()=>{if(!stored){if(inp.value.length<4)return toast('Use at least 4 digits');localStorage.setItem(storageKey,await sha(inp.value));onUnlock()}else if(await sha(inp.value)===stored)onUnlock();else{inp.value='';toast('Wrong PIN')}};c.append(h,tip,inp,b);p.append(c);inp.focus()}
function openSecond(){pinGate('second-pin-hash','Second Space','Enter the PIN for your deeper space.',renderSecond,()=>{renderHome();show(home)})}
function renderSecond(){second.innerHTML='';let w=document.createElement('div');w.className='homebg secondbg';let t=document.createElement('div');t.className='top';let h=document.createElement('h1');h.textContent='Second Space';let back=document.createElement('button');back.className='ghost';back.textContent='Back';back.onclick=()=>{renderHome();show(home)};t.append(h,back);let s=document.createElement('div');s.className='subtle';s.textContent='A separate layer with its own apps and PIN.';let g=document.createElement('div');g.className='grid';g.append(icon({name:'App Store',icon:'A',cls:'store'},()=>store(2)));installed('second-installed',defs2).forEach(id=>g.append(icon(defs2[id],()=>openApp(id,2))));w.append(t,s,g);second.append(w);show(second)}
function openDeep(){pinGate('deep-pin-hash','Deep Space','Enter the PIN for the third space.',renderDeep,renderSecond)}
function renderDeep(){deep.innerHTML='';let w=document.createElement('div');w.className='homebg deepbg';let t=document.createElement('div');t.className='top';let h=document.createElement('h1');h.textContent='Deep Space';let back=document.createElement('button');back.className='ghost';back.textContent='Back';back.onclick=renderSecond;t.append(h,back);let s=document.createElement('div');s.className='subtle';s.textContent='Third layer. Separate apps, notes, files, and PIN.';let g=document.createElement('div');g.className='grid';g.append(icon({name:'App Store',icon:'A',cls:'store'},()=>store(3)));installed('deep-installed',defs3).forEach(id=>g.append(icon(defs3[id],()=>openApp(id,3))));w.append(t,s,g);deep.append(w);show(deep)}
