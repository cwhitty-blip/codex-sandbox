<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Mafia</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07080b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(420px,100%);background:#11141a;border:1px solid #29303a;border-radius:22px;padding:26px;text-align:center;box-shadow:0 22px 70px rgba(0,0,0,.35)}.logo{font-size:54px;font-weight:1000;letter-spacing:-.05em;margin:0 0 6px}.sub{color:#aab0b9;margin:0 0 22px}.lock{font-size:44px;margin-bottom:10px}input{width:100%;height:58px;border-radius:14px;border:1px solid #343b45;background:#090b0f;color:#fff;text-align:center;font-size:26px;font-weight:900;outline:none}button{width:100%;height:58px;border:0;border-radius:14px;background:#df3b46;color:#fff;font-size:18px;font-weight:900;margin-top:10px;touch-action:manipulation}.err{min-height:22px;color:#ff939a;font-weight:800;margin-top:9px}.game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07080b;display:none}</style></head><body><div class="gate" id="gate"><div class="card"><div class="lock">🔒</div><div class="logo">MAFIA</div><p class="sub">Enter the password to play.</p><input id="pw" type="password" inputmode="numeric" autocomplete="off" aria-label="Password"><button id="go">OPEN GAME</button><div class="err" id="err"></div></div></div><iframe class="game" id="game" src="about:blank" allow="autoplay"></iframe><script>(()=>{const p=document.getElementById('pw'),g=document.getElementById('gate'),f=document.getElementById('game'),e=document.getElementById('err');function openGame(){if(p.value==='1'){e.textContent='';g.style.display='none';f.style.display='block';f.src='../mafia/?locked=1&fresh='+Date.now()}else{e.textContent='Wrong password';p.value='';p.focus()}}document.getElementById('go').onclick=openGame;p.addEventListener('keydown',x=>{if(x.key==='Enter')openGame()});setTimeout(()=>p.focus(),200)})();</script></body></html>
