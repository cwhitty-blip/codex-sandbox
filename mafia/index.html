<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mafia</title><style>*{box-sizing:border-box}body{margin:0;background:#07080b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}button,textarea,select{font:inherit;touch-action:manipulation}.w{max-width:700px;margin:auto;padding:14px}.box{background:#11141a;border:1px solid #2a3039;border-radius:18px;padding:18px;margin:10px 0}h1{font-size:52px;margin:5px 0}p{color:#aab0b9}.r{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292e36;padding:12px 0}.r:last-child{border:0}.st{display:flex;align-items:center;gap:7px}.st button{width:44px;height:44px;border:0;border-radius:12px;background:#20252d;color:white;font-size:23px}.n{width:28px;text-align:center;font-weight:900;font-size:21px}textarea,select{width:100%;background:#090b0f;color:white;border:1px solid #303640;border-radius:12px;padding:12px;font-size:16px}textarea{height:110px}.btn{width:100%;min-height:54px;margin-top:9px;border:0;border-radius:13px;background:#242932;color:white;font-weight:900}.red{background:#df3b46}.gold{background:#3a301b;color:#ffe0a0}.hide{display:none!important}.deal{min-height:75vh;display:grid;place-items:center;text-align:center}.big{font-size:45px;font-weight:900}.table{position:fixed;inset:0;background:#050608;z-index:9;padding:max(14px,env(safe-area-inset-top)) 14px;display:flex;flex-direction:column}.top{display:flex;justify-content:flex-end}.x{width:46px;height:46px;border:1px solid #333;border-radius:12px;background:#111;color:#fff;font-size:22px}.center{flex:1;display:grid;place-items:center}.grid{width:100%;max-width:700px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.person{min-height:78px;border:1px solid #343b45;border-radius:16px;background:#151920;color:white;font-size:22px;font-weight:900}.orb{width:120px;height:120px;border-radius:50%;background:#11151b;border:1px solid #303640;box-shadow:0 0 55px #4c1118}.bottom{text-align:center;padding:8px}.repeat{width:54px;height:54px;border-radius:50%;border:1px solid #333;background:#12151a;color:white}.flash{position:fixed;inset:0;background:#050608;z-index:20;display:grid;place-items:center;text-align:center;padding:20px}.flash b{font-size:55px}.flash p{font-size:18px}.small{font-size:12px;color:#999}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="w" id="setup"><h1>MAFIA</h1><p>Deal the roles. Put the phone in the middle. Let it run the night.</p><div class="box"><div class="r"><b>Players</b><div class="st"><button data-p="-1">−</button><span class="n" id="pc">8</span><button data-p="1">+</button></div></div><div class="r"><b>Mafia</b><div class="st"><button data-r="mafia" data-d="-1">−</button><span class="n" id="mafia">2</span><button data-r="mafia" data-d="1">+</button></div></div><div class="r"><b>Doctor</b><div class="st"><button data-r="doctor" data-d="-1">−</button><span class="n" id="doctor">1</span><button data-r="doctor" data-d="1">+</button></div></div><div class="r"><b>Detective</b><div class="st"><button data-r="detective" data-d="-1">−</button><span class="n" id="detective">1</span><button data-r="detective" data-d="1">+</button></div></div><p class="small">Player names — one per line</p><textarea id="names" placeholder="Malachi&#10;Asher&#10;Judah&#10;Aria"></textarea><p class="small">Voice</p><select id="voice"><option value="">Best available voice</option></select><button class="btn gold" id="test">🔊 Test voice</button><button class="btn red" id="deal">Deal secret roles</button></div></main><main class="w hide" id="dealScreen"><button class="btn" id="back">← Setup</button><div class="box deal"><div id="cover"><div class="big" id="who"></div><p>Make sure nobody else can see.</p><button class="btn red" id="reveal">Reveal my role</button></div><div id="role" class="hide"><div class="big" id="roleName"></div><p id="roleDesc"></p><button class="btn red" id="pass">Hide & pass phone</button></div></div></main><section id="table" class="table hide"><div class="top"><button class="x" id="exit">×</button></div><div class="center"><div id="orb" class="orb"></div><div id="grid" class="grid hide"></div></div><div class="bottom"><button class="repeat" id="repeat">🔊</button></div></section><section id="flash" class="flash hide"><div><b id="flashBig"></b><p id="flashSmall"></p></div></section><script>(()=>{const $=x=>document.getElementById(x),S={p:8,r:{mafia:2,doctor:1,detective:1},names:[],deck:[],i:0,alive:[],m:null,d:null,voices:[],last:""};const info={mafia:["MAFIA","Wake with the Mafia and choose someone to eliminate."],doctor:["DOCTOR","Choose someone to protect."],detective:["DETECTIVE","Investigate someone. The phone will answer you."],villager:["VILLAGER","Stay asleep at night. Help find the Mafia during the day."]};function upd(){$("pc").textContent=S.p;for(const k in S.r)$(k).textContent=S.r[k]}document.onclick=e=>{let b=e.target.closest("[data-p]");if(b){S.p=Math.max(5,Math.min(24,S.p+ +b.dataset.p));upd()}b=e.target.closest("[data-r]");if(b){let k=b.dataset.r,min=k==="mafia"?1:0;S.r[k]=Math.max(min,S.r[k]+ +b.dataset.d);upd()}};function load(){if(!speechSynthesis)return;S.voices=speechSynthesis.getVoices();$("voice").innerHTML='<option value="">Best available voice</option>';S.voices.forEach((v,i)=>{if(/^en/i.test(v.lang))$("voice").add(new Option(v.name,i))})}if("speechSynthesis"in window){load();speechSynthesis.onvoiceschanged=load;setTimeout(load,500)}function voice(){let i=$("voice").value;if(i!==""&&S.voices[i])return S.voices[i];for(const n of["Ava","Samantha","Aaron","Daniel"]){let v=S.voices.find(x=>x.name.includes(n));if(v)return v}return S.voices.find(x=>/^en/i.test(x.lang))}function say(t,cb){S.last=t;if(!("speechSynthesis"in window)){cb&&cb();return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.9;u.pitch=.95;let v=voice();if(v)u.voice=v;u.onend=()=>cb&&cb();u.onerror=()=>cb&&cb();speechSynthesis.speak(u)}function seq(a,cb){let i=0;function n(){if(i>=a.length){cb&&cb();return}let z=a[i++];if(typeof z==="number")setTimeout(n,z);else say(z,n)}n()}$("test").onclick=()=>seq(["All right, everybody.",200,"The game is ready.",200,"Trust nobody."]);$("repeat").onclick=()=>S.last&&say(S.last);function names(){let a=$("names").value.split(/\n/).map(x=>x.trim()).filter(Boolean);while(a.length<S.p)a.push("Player "+(a.length+1));return a.slice(0,S.p)}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}$("deal").onclick=()=>{let special=S.r.mafia+S.r.doctor+S.r.detective;if(special>S.p)return alert("Too many roles.");S.names=names();S.deck=[];for(let k in S.r)for(let i=0;i<S.r[k];i++)S.deck.push(k);while(S.deck.length<S.p)S.deck.push("villager");shuffle(S.deck);S.alive=S.names.map(()=>true);S.i=0;renderDeal();$("setup").classList.add("hide");$("dealScreen").classList.remove("hide")};function renderDeal(){$("who").textContent=S.names[S.i];$("cover").classList.remove("hide");$("role").classList.add("hide")}$("reveal").onclick=()=>{let x=info[S.deck[S.i]];$("roleName").textContent=x[0];$("roleDesc").textContent=x[1];$("cover").classList.add("hide");$("role").classList.remove("hide")};$("pass").onclick=()=>{if(++S.i>=S.p)start();else renderDeal()};$("back").onclick=()=>{$("dealScreen").classList.add("hide");$("setup").classList.remove("hide")};function wait(){$("grid").classList.add("hide");$("orb").classList.remove("hide")}function picks(fn){let g=$("grid");g.innerHTML="";S.names.forEach((n,i)=>{if(!S.alive[i])return;let b=document.createElement("button");b.className="person";b.textContent=n;b.onclick=()=>fn(i);g.appendChild(b)});$("orb").classList.add("hide");g.classList.remove("hide")}function start(){$("dealScreen").classList.add("hide");$("table").classList.remove("hide");S.m=S.d=null;wait();seq(["All right, everyone.",200,"Go to sleep.",250,"Close your eyes."],()=>setTimeout(mafia,450))}function mafia(){wait();seq(["Mafia, open your eyes.",250,"Who do you want to eliminate?"],()=>picks(i=>{S.m=i;wait();seq(["Got it.",150,"Mafia, close your eyes."],()=>setTimeout(doctor,450))}))}function doctor(){if(!S.r.doctor)return detective();wait();seq(["Doctor, open your eyes.",250,"Who do you want to save?"],()=>picks(i=>{S.d=i;wait();seq(["Got it.",150,"Doctor, close your eyes."],()=>setTimeout(detective,450))}))}function detective(){if(!S.r.detective)return sunrise();wait();seq(["Detective, open your eyes.",250,"Who do you want to accuse?"],()=>picks(i=>{wait();let yes=S.deck[i]==="mafia";flash(yes?"YES":"NO",S.names[i]+(yes?" is Mafia.":" is not Mafia."));say((yes?"Yes. ":"No. ")+S.names[i]+(yes?" is Mafia.":" is not Mafia."),()=>setTimeout(()=>{unflash();say("Detective, close your eyes.",()=>setTimeout(sunrise,450))},700))}))}function sunrise(){wait();let killed=S.m!==null&&S.m!==S.d?S.m:null,saved=S.r.doctor&&S.d!==null?S.d:null;if(killed!==null)S.alive[killed]=false;let a=["Everyone, open your eyes.",300,"All right.",180,"This is what happened.",260,killed===null?"Nobody got eliminated.":S.names[killed]+" got eliminated."];if(saved!==null){a.push(240,S.names[saved]+" got saved by the Doctor.");a.push(220,S.m===saved?"The Doctor stopped the Mafia.":"The Doctor protected "+S.names[saved]+".")}seq(a,()=>{let big=killed===null?"Nobody eliminated":S.names[killed]+" eliminated",small=saved!==null?S.names[saved]+" was saved by the Doctor.":"The day begins.";flash(big,small);setTimeout(()=>{unflash();picks(()=>{})},2600)})}function flash(a,b){$("flashBig").textContent=a;$("flashSmall").textContent=b;$("flash").classList.remove("hide")}function unflash(){$("flash").classList.add("hide")}$("exit").onclick=()=>{speechSynthesis.cancel();$("table").classList.add("hide");$("setup").classList.remove("hide")};upd()})();</script></body></html>
