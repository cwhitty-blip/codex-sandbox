<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Mafia</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#07080b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}button,textarea{font:inherit;touch-action:manipulation}.w{max-width:700px;margin:auto;padding:14px}.box{background:#11141a;border:1px solid #29303a;border-radius:18px;padding:18px;margin:10px 0}h1{font-size:52px;margin:5px 0}p{color:#aab0b9}.r{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292e36;padding:12px 0}.st{display:flex;align-items:center;gap:7px}.st button{width:48px;height:48px;border:0;border-radius:12px;background:#20252d;color:#fff;font-size:25px;position:relative;z-index:5}.n{width:34px;text-align:center;font-weight:900;font-size:22px}textarea{width:100%;height:110px;background:#090b0f;color:#fff;border:1px solid #303640;border-radius:12px;padding:12px;font-size:16px}.btn{width:100%;min-height:54px;margin-top:9px;border:0;border-radius:13px;background:#242932;color:#fff;font-weight:900}.red{background:#df3b46}.gold{background:#3a301b;color:#ffe0a0}.hide{display:none!important}.deal{min-height:75vh;display:grid;place-items:center;text-align:center}.big{font-size:45px;font-weight:900}.roleline{display:flex;align-items:center;justify-content:center;gap:12px}.pic{font-size:48px}.table{position:fixed;inset:0;background:#050608;z-index:9;padding:14px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between}.x{width:46px;height:46px;border:1px solid #333;border-radius:12px;background:#111;color:#fff}.center{flex:1;display:grid;place-items:center}.grid{width:100%;max-width:700px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.person{min-height:78px;border:1px solid #343b45;border-radius:16px;background:#151920;color:#fff;font-size:22px;font-weight:900}.orb{width:120px;height:120px;border-radius:50%;background:#11151b;box-shadow:0 0 55px #4c1118}.flash{position:fixed;inset:0;background:#050608;z-index:20;display:grid;place-items:center;text-align:center;padding:20px}.flash b{font-size:55px}.small{font-size:12px;color:#999}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="w" id="setup"><h1>MAFIA</h1><p>Deal the roles. Sound changes with night and morning.</p><div class="box"><div class="r"><b>Players</b><div class="st"><button type="button" id="pminus">−</button><span class="n" id="pc">8</span><button type="button" id="pplus">+</button></div></div><div class="r"><b>🥷 Mafia</b><div class="st"><button type="button" id="mminus">−</button><span class="n" id="mafia">2</span><button type="button" id="mplus">+</button></div></div><div class="r"><b>🧑‍⚕️ Doctor</b><div class="st"><button type="button" id="dminus">−</button><span class="n" id="doctor">1</span><button type="button" id="dplus">+</button></div></div><div class="r"><b>🕵️‍♀️ Detective</b><div class="st"><button type="button" id="tminus">−</button><span class="n" id="detective">1</span><button type="button" id="tplus">+</button></div></div><p class="small">Player names — one per line</p><textarea id="names" placeholder="Malachi&#10;Asher&#10;Judah&#10;Aria"></textarea><button class="btn gold" id="test">🔊 Test Sound</button><button class="btn red" id="deal">Deal secret roles</button></div></main><main class="w hide" id="dealScreen"><div class="box deal"><div id="cover"><div class="big" id="who"></div><p>Make sure nobody else can see.</p><button class="btn red" id="reveal">Reveal my role</button></div><div id="role" class="hide"><div class="roleline"><span class="pic" id="rolePic"></span><div class="big" id="roleName"></div></div><p id="roleDesc"></p><button class="btn red" id="pass">Hide & pass phone</button></div></div></main><section id="table" class="table hide"><div class="top"><b id="round">ROUND 1</b><button class="x" id="exit">×</button></div><div class="center"><div id="orb" class="orb"></div><div id="grid" class="grid hide"></div></div></section><section id="flash" class="flash hide"><div><b id="fb"></b><p id="fs"></p></div></section><script>(()=>{const $=x=>document.getElementById(x),S={p:8,r:{mafia:2,doctor:1,detective:1},names:[],deck:[],i:0,alive:[],m:null,d:null,v:[],round:1};const I={mafia:['🥷','MAFIA','Choose someone to eliminate.'],doctor:['🧑‍⚕️','DOCTOR','Choose someone to protect.'],detective:['🕵️‍♀️','DETECTIVE','Investigate a player.'],villager:['🧑','VILLAGER','Help find the Mafia.']};function upd(){$('pc').textContent=S.p;$('mafia').textContent=S.r.mafia;$('doctor').textContent=S.r.doctor;$('detective').textContent=S.r.detective}function role(k,d){let min=k==='mafia'?1:0;S.r[k]=Math.max(min,Math.min(S.p,S.r[k]+d));upd()}$('pminus').onclick=()=>{S.p=Math.max(5,S.p-1);upd()};$('pplus').onclick=()=>{S.p=Math.min(24,S.p+1);upd()};$('mminus').onclick=()=>role('mafia',-1);$('mplus').onclick=()=>role('mafia',1);$('dminus').onclick=()=>role('doctor',-1);$('dplus').onclick=()=>role('doctor',1);$('tminus').onclick=()=>role('detective',-1);$('tplus').onclick=()=>role('detective',1);let ac,nightTimer=null,dayTimer=null;function audio(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}function tone(f,d=.1,v=.06,type='sine',when=0){audio();let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+when;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03)}function stopNight(){if(nightTimer){clearInterval(nightTimer);nightTimer=null}}function stopDay(){if(dayTimer){clearInterval(dayTimer);dayTimer=null}}function cricketBurst(){let b=2200+Math.random()*650;for(let i=0;i<6;i++)tone(b+i*24,.026,.022,'square',i*.055)}function startCrickets(){stopNight();stopDay();cricketBurst();nightTimer=setInterval(cricketBurst,720)}function birdBurst(){let f=1200+Math.random()*900;tone(f,.07,.042);tone(f*1.17,.06,.03,'sine',.085)}function morningMusic(){[523,659,784,1046].forEach((f,i)=>tone(f,.34,.045,'sine',i*.18))}function startBirds(){stopNight();stopDay();morningMusic();birdBurst();dayTimer=setInterval(birdBurst,1450)}function rooster(){stopNight();stopDay();[390,470,560,650,590,500].forEach((f,i)=>tone(f,.22,.09,'sawtooth',i*.13))}function load(){if(!('speechSynthesis'in window))return;S.v=speechSynthesis.getVoices()}if('speechSynthesis'in window){load();speechSynthesis.onvoiceschanged=load}function say(t,c){if(!('speechSynthesis'in window))return c&&c();speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.92;u.pitch=1.04;for(let n of['Ava','Samantha','Victoria']){let v=S.v.find(x=>x.name.includes(n));if(v){u.voice=v;break}}u.onend=u.onerror=()=>c&&c();speechSynthesis.speak(u)}function seq(a,c){let i=0;(function n(){if(i>=a.length)return c&&c();let z=a[i++];typeof z==='number'?setTimeout(n,z):say(z,n)})()}$('test').onclick=()=>{audio();say('All right, everybody. Go to bed.',()=>{startCrickets();setTimeout(()=>{stopNight();say('All right, everybody, wake up.',()=>{rooster();setTimeout(()=>say('Good morning.',()=>startBirds()),900)})},1700)})};function names(){let a=$('names').value.split(/\n/).map(x=>x.trim()).filter(Boolean);while(a.length<S.p)a.push('Player '+(a.length+1));return a.slice(0,S.p)}function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}$('deal').onclick=()=>{audio();stopNight();stopDay();let q=S.r.mafia+S.r.doctor+S.r.detective;if(q>S.p)return alert('Too many roles');S.names=names();S.deck=[];for(let k in S.r)for(let i=0;i<S.r[k];i++)S.deck.push(k);while(S.deck.length<S.p)S.deck.push('villager');sh(S.deck);S.alive=S.names.map(()=>1);S.i=0;S.round=1;rd();$('setup').classList.add('hide');$('dealScreen').classList.remove('hide')};function rd(){$('who').textContent=S.names[S.i];$('cover').classList.remove('hide');$('role').classList.add('hide')}$('reveal').onclick=()=>{audio();let x=I[S.deck[S.i]];$('rolePic').textContent=x[0];$('roleName').textContent=x[1];$('roleDesc').textContent=x[2];$('cover').classList.add('hide');$('role').classList.remove('hide');$('pass').textContent=S.i===S.p-1?'Start Game':'Hide & pass phone'};$('pass').onclick=()=>{audio();if(++S.i>=S.p)start();else rd()};function wait(){$('grid').classList.add('hide');$('orb').classList.remove('hide')}function picks(f){let g=$('grid');g.innerHTML='';S.names.forEach((n,i)=>{if(!S.alive[i])return;let b=document.createElement('button');b.className='person';b.textContent=n;b.onclick=()=>{audio();f(i)};g.appendChild(b)});$('orb').classList.add('hide');g.classList.remove('hide')}function living(r){return S.names.some((_,i)=>S.alive[i]&&S.deck[i]===r)}function start(){stopDay();stopNight();$('dealScreen').classList.add('hide');$('table').classList.remove('hide');$('round').textContent='ROUND '+S.round;S.m=S.d=null;wait();seq(['Round '+S.round+'.',150,'All right, everybody. Go to bed.'],()=>{startCrickets();setTimeout(()=>say('Close your eyes.',()=>setTimeout(mafia,350)),180)})}function mafia(){if(!living('mafia'))return town();wait();seq(['Mafia, open your eyes.',180,'Who do you want to eliminate?'],()=>picks(i=>{S.m=i;wait();say('Mafia, close your eyes.',()=>setTimeout(doctor,300))}))}function doctor(){if(!living('doctor'))return detective();wait();seq(['Doctor, open your eyes.',180,'Who do you want to save?'],()=>picks(i=>{S.d=i;wait();say('Doctor, close your eyes.',()=>setTimeout(detective,300))}))}function detective(){if(!living('detective'))return sunrise();wait();seq(['Detective, open your eyes.',180,'Who do you want to accuse?'],()=>picks(i=>{wait();let y=S.deck[i]==='mafia';flash(y?'YES':'NO',y?'That person is the Mafia.':'That person is not the Mafia.');say(y?'Yes. That person is the Mafia.':'No. That person is not the Mafia.',()=>setTimeout(()=>{unflash();say('Detective, close your eyes.',()=>setTimeout(sunrise,300))},600))}))}function sunrise(){wait();stopNight();let k=S.m!==null&&S.m!==S.d?S.m:null,s=living('doctor')&&S.d!==null?S.d:null;if(k!==null)S.alive[k]=0;say('All right, everybody, wake up.',()=>{rooster();setTimeout(()=>say('Good morning.',()=>{startBirds();let a=[k===null?'Nobody got eliminated.':S.names[k]+' got eliminated.'];if(s!==null)a.push(180,S.names[s]+' got saved by the Doctor.');seq(a,()=>setTimeout(dayVote,350))}),950)})}function dayVote(){if(!living('mafia'))return town();wait();say('Okay. Who do you want to eliminate?',()=>picks(i=>{S.alive[i]=0;let m=S.deck[i]==='mafia';flash(S.names[i]+' eliminated',m?'That player was Mafia.':'That player was not Mafia.');say(m?'That player was Mafia.':'That player was not Mafia.',()=>setTimeout(()=>{unflash();if(!living('mafia'))town();else{S.round++;start()}},900))}))}function town(){stopNight();stopDay();flash('TOWN WINS','The Mafia is out.');say('The Mafia is out. The town wins.')}function flash(a,b){$('fb').textContent=a;$('fs').textContent=b;$('flash').classList.remove('hide')}function unflash(){$('flash').classList.add('hide')}$('exit').onclick=()=>location.reload();upd()})();</script></body></html>
