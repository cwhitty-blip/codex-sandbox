<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Mafia</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#07080b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}button,textarea,select{font:inherit;touch-action:manipulation}.w{max-width:720px;margin:auto;padding:18px}.box{background:#11141a;border:1px solid #2d333d;border-radius:20px;padding:18px}.row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #2d333d}.step{display:flex;gap:9px;align-items:center}.step button{width:50px;height:50px;border:0;border-radius:14px;background:#222831;color:#fff;font-size:28px}.num{width:34px;text-align:center;font-size:24px;font-weight:900}.btn{width:100%;min-height:56px;border:0;border-radius:14px;margin-top:12px;font-weight:900;font-size:18px;background:#252b34;color:#fff}.red{background:#e43b47}.gold{background:#3b301c;color:#ffe2a1}.hide{display:none!important}h1{font-size:54px;margin:8px 0}p,.muted{color:#aab0b9}.modes{margin-top:16px;border:1px solid #3a414b;border-radius:16px;padding:14px}.modes h3{margin:0 0 8px}.modeRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid #2d333d}.modeRow:first-of-type{border-top:0}.seg{display:flex;background:#0c0f14;border-radius:12px;padding:5px;gap:4px}.seg button{border:0;border-radius:9px;background:transparent;color:#fff;padding:10px 14px;font-weight:800}.seg button.on{background:#464b53}.assign{margin-top:16px}.assignTop{display:flex;justify-content:space-between;align-items:center;gap:10px}.toggle{border:1px solid #3a414b;border-radius:12px;background:#222831;color:#fff;padding:12px 16px;font-weight:900}.toggle.on{background:#3b301c;color:#ffe2a1}.manual{margin-top:12px;padding:12px;border:1px solid #333a44;border-radius:14px;background:#0b0e12}.assignRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-top:9px}.assignRow select{width:100%;min-height:46px;border:1px solid #343b45;border-radius:10px;background:#151920;color:#fff;padding:8px}textarea{width:100%;height:150px;border:1px solid #343b45;border-radius:12px;background:#090b0f;color:#fff;padding:12px;font-size:18px}.deal{min-height:78vh;display:grid;place-items:center;text-align:center}.big{font-size:48px;font-weight:1000}.roleLine{display:flex;justify-content:center;align-items:center;gap:12px}.pic{font-size:52px}.table{position:fixed;inset:0;background:#050608;z-index:10;padding:16px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.x{width:48px;height:48px;border:1px solid #343b45;border-radius:13px;background:#14181e;color:#fff;font-size:24px}.center{flex:1;display:grid;place-items:center}.grid{width:100%;max-width:720px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.person,.pass{min-height:78px;border:1px solid #343b45;border-radius:15px;background:#151920;color:#fff;font-size:21px;font-weight:900}.pass{grid-column:1/-1;background:#3b301c;color:#ffe2a1}.orb{width:120px;height:120px;border-radius:50%;background:#11151b;box-shadow:0 0 55px #52131b}.flash{position:fixed;inset:0;z-index:20;background:#050608;display:grid;place-items:center;text-align:center;padding:20px}.flash b{font-size:54px}.actions{display:grid;gap:10px;margin-top:24px;min-width:min(340px,82vw)}@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><main id="setup" class="w"><h1>MAFIA</h1><p>Six players are ready to go.</p><div class="box"><div class="row"><b>Players</b><div class="step"><button id="pminus">−</button><span id="pc" class="num">6</span><button id="pplus">+</button></div></div><div class="row"><b>🥷 Mafia</b><div class="step"><button id="mminus">−</button><span id="mc" class="num">2</span><button id="mplus">+</button></div></div><div class="row"><b>🧑‍⚕️ Doctor</b><div class="step"><button id="dminus">−</button><span id="dc" class="num">1</span><button id="dplus">+</button></div></div><div class="row"><b>🕵️‍♀️ Detective</b><div class="step"><button id="tminus">−</button><span id="tc" class="num">1</span><button id="tplus">+</button></div></div><div class="modes"><h3>When there are 2 of a role</h3><div class="modeRow"><span>🥷 Mafia</span><div class="seg"><button id="maSep">Separate</button><button id="maTog" class="on">Together</button></div></div><div class="modeRow"><span>🧑‍⚕️ Doctors</span><div class="seg"><button id="doSep">Separate</button><button id="doTog" class="on">Together</button></div></div><div class="modeRow"><span>🕵️‍♀️ Detectives</span><div class="seg"><button id="deSep">Separate</button><button id="deTog" class="on">Together</button></div></div></div><div class="assign"><div class="assignTop"><div><b>🎯 Role assignment</b><div class="muted">Random or choose everybody's role</div></div><button id="assignToggle" class="toggle">RANDOM</button></div><div id="manual" class="manual hide"><b>Choose every player's role</b><div id="assignRows"></div></div></div><p class="muted">Players</p><textarea id="names">Dad
Mom
Judah
Asher
Aria
Malachi</textarea><button id="test" class="btn gold">🔊 Test Sound</button><button id="deal" class="btn red">Start Round / Deal Roles</button></div></main><main id="dealScreen" class="w hide"><div class="box deal"><div id="cover"><div id="who" class="big"></div><p>Make sure nobody else can see.</p><button id="reveal" class="btn red">Reveal my role</button></div><div id="role" class="hide"><div class="roleLine"><span id="rolePic" class="pic"></span><div id="roleName" class="big"></div></div><p id="roleDesc"></p><button id="passRole" class="btn red">Hide & pass phone</button></div></div></main><section id="table" class="table hide"><div class="top"><b id="round">ROUND 1</b><button id="exit" class="x">×</button></div><div class="center"><div id="orb" class="orb"></div><div id="grid" class="grid hide"></div></div></section><section id="flash" class="flash hide"><div><b id="fb"></b><p id="fs"></p><div id="actions" class="actions hide"><button id="again" class="btn red">↻ PLAY AGAIN</button><button id="back" class="btn">✕ BACK TO SETUP</button></div></div></section><script>(()=>{const $=x=>document.getElementById(x);const S={p:6,c:{mafia:2,doctor:1,detective:1},sep:{mafia:false,doctor:false,detective:false},manual:false,chosen:[],names:[],deck:[],alive:[],i:0,round:1,queue:[],q:0,targets:[],saves:[],voices:[]};const info={mafia:['🥷','MAFIA','Choose someone to eliminate.'],doctor:['🧑‍⚕️','DOCTOR','Choose someone to save.'],detective:['🕵️‍♀️','DETECTIVE','Investigate someone.'],villager:['🧑','VILLAGER','Help find the Mafia.']};function names(){let a=$('names').value.split(/\n/).map(x=>x.trim()).filter(Boolean);while(a.length<S.p)a.push('Player '+(a.length+1));return a.slice(0,S.p)}function sync(){pc.textContent=S.p;mc.textContent=S.c.mafia;dc.textContent=S.c.doctor;tc.textContent=S.c.detective;renderManual()}function step(role,d){if(S.manual){S.manual=false;assignToggle.textContent='RANDOM';assignToggle.classList.remove('on');manual.classList.add('hide')}let min=role==='mafia'?1:0;S.c[role]=Math.max(min,Math.min(S.p,S.c[role]+d));sync()}pminus.onclick=()=>{S.p=Math.max(5,S.p-1);S.chosen=S.chosen.slice(0,S.p);sync()};pplus.onclick=()=>{S.p=Math.min(24,S.p+1);sync()};mminus.onclick=()=>step('mafia',-1);mplus.onclick=()=>step('mafia',1);dminus.onclick=()=>step('doctor',-1);dplus.onclick=()=>step('doctor',1);tminus.onclick=()=>step('detective',-1);tplus.onclick=()=>step('detective',1);function mode(role,val,a,b){S.sep[role]=val;$(a).classList.toggle('on',val);$(b).classList.toggle('on',!val)}maSep.onclick=()=>mode('mafia',true,'maSep','maTog');maTog.onclick=()=>mode('mafia',false,'maSep','maTog');doSep.onclick=()=>mode('doctor',true,'doSep','doTog');doTog.onclick=()=>mode('doctor',false,'doSep','doTog');deSep.onclick=()=>mode('detective',true,'deSep','deTog');deTog.onclick=()=>mode('detective',false,'deSep','deTog');function renderManual(){manual.classList.toggle('hide',!S.manual);assignRows.innerHTML='';if(!S.manual)return;let ns=names();while(S.chosen.length<ns.length)S.chosen.push('villager');S.chosen=S.chosen.slice(0,ns.length);ns.forEach((n,i)=>{let r=document.createElement('div');r.className='assignRow';let l=document.createElement('b');l.textContent=n;let s=document.createElement('select');[['villager','🧑 Villager'],['mafia','🥷 Mafia'],['doctor','🧑‍⚕️ Doctor'],['detective','🕵️‍♀️ Detective']].forEach(([v,t])=>{let o=document.createElement('option');o.value=v;o.textContent=t;o.selected=S.chosen[i]===v;s.appendChild(o)});s.onchange=()=>{S.chosen[i]=s.value;countChosen()};r.append(l,s);assignRows.appendChild(r)});countChosen()}function countChosen(){if(!S.manual)return;S.c.mafia=S.chosen.filter(x=>x==='mafia').length;S.c.doctor=S.chosen.filter(x=>x==='doctor').length;S.c.detective=S.chosen.filter(x=>x==='detective').length;mc.textContent=S.c.mafia;dc.textContent=S.c.doctor;tc.textContent=S.c.detective}assignToggle.onclick=()=>{S.manual=!S.manual;assignToggle.textContent=S.manual?'CHOOSE ALL':'RANDOM';assignToggle.classList.toggle('on',S.manual);if(S.manual&&S.chosen.length!==S.p){S.chosen=Array(S.p).fill('villager');let k=0;for(let i=0;i<S.c.mafia&&k<S.p;i++)S.chosen[k++]='mafia';for(let i=0;i<S.c.doctor&&k<S.p;i++)S.chosen[k++]='doctor';for(let i=0;i<S.c.detective&&k<S.p;i++)S.chosen[k++]='detective'}renderManual()};names.addEventListener('input',renderManual);function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}let ac,nightTimer,dayTimer;function audio(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}function tone(f,d=.1,v=.05,type='sine',w=0){audio();let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+w;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03)}function crickets(){clearInterval(dayTimer);let burst=()=>{let b=2200+Math.random()*500;for(let i=0;i<5;i++)tone(b+i*25,.025,.02,'square',i*.05)};burst();clearInterval(nightTimer);nightTimer=setInterval(burst,750)}function stopNight(){clearInterval(nightTimer)}function birds(){clearInterval(nightTimer);let b=()=>{let f=1300+Math.random()*700;tone(f,.07,.04);tone(f*1.18,.06,.03,'sine',.08)};b();clearInterval(dayTimer);dayTimer=setInterval(b,1450)}function stopDay(){clearInterval(dayTimer)}function rooster(){stopNight();stopDay();[390,470,560,650,590,500].forEach((f,i)=>tone(f,.2,.08,'sawtooth',i*.13))}function loadVoices(){if('speechSynthesis'in window)S.voices=speechSynthesis.getVoices()}loadVoices();if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=loadVoices;function say(t,cb){if(!('speechSynthesis'in window)){cb&&cb();return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.92;u.pitch=1.04;for(let n of['Ava','Samantha','Victoria']){let v=S.voices.find(x=>x.name.includes(n));if(v){u.voice=v;break}}u.onend=u.onerror=()=>cb&&cb();speechSynthesis.speak(u)}function seq(a,cb){let i=0;(function n(){if(i>=a.length){cb&&cb();return}let z=a[i++];typeof z==='number'?setTimeout(n,z):say(z,n)})()}test.onclick=()=>{audio();say('All right, everybody. Go to bed.',()=>{crickets();setTimeout(()=>{stopNight();say('Everybody wake up.',()=>{rooster();setTimeout(()=>{say('Good morning.',birds)},900)})},1500)})};deal.onclick=()=>{audio();stopNight();stopDay();S.names=names();if(S.manual){S.deck=S.chosen.slice(0,S.p);if(!S.deck.includes('mafia'))return alert('Choose at least one Mafia.')}else{let total=S.c.mafia+S.c.doctor+S.c.detective;if(total>S.p)return alert('Too many special roles.');S.deck=[];for(let i=0;i<S.c.mafia;i++)S.deck.push('mafia');for(let i=0;i<S.c.doctor;i++)S.deck.push('doctor');for(let i=0;i<S.c.detective;i++)S.deck.push('detective');while(S.deck.length<S.p)S.deck.push('villager');shuffle(S.deck)}S.alive=S.names.map(()=>true);S.i=0;S.round=1;showDeal();setup.classList.add('hide');dealScreen.classList.remove('hide')};function showDeal(){who.textContent=S.names[S.i];cover.classList.remove('hide');role.classList.add('hide')}function roleNum(i,r){return S.deck.map((x,j)=>x===r?j:-1).filter(x=>x>=0).indexOf(i)+1}function roleLabel(i){let r=S.deck[i],count=S.deck.filter(x=>x===r).length,label=info[r][1];if(count>1&&S.sep[r])label+=' #'+roleNum(i,r);return label}reveal.onclick=()=>{audio();let r=S.deck[S.i],x=info[r];rolePic.textContent=x[0];roleName.textContent=roleLabel(S.i);roleDesc.textContent=x[2];cover.classList.add('hide');role.classList.remove('hide');passRole.textContent=S.i===S.p-1?'Start Game':'Hide & pass phone'};passRole.onclick=()=>{audio();S.i++;if(S.i>=S.p)startRound();else showDeal()};function wait(){grid.classList.add('hide');orb.classList.remove('hide')}function picks(cb,tie){grid.innerHTML='';S.names.forEach((n,i)=>{if(!S.alive[i])return;let b=document.createElement('button');b.className='person';b.textContent=n;b.onclick=()=>{audio();cb(i)};grid.appendChild(b)});if(tie){let b=document.createElement('button');b.className='pass';b.textContent='🤝 TIE / PASS — NEXT ROUND';b.onclick=tie;grid.appendChild(b)}orb.classList.add('hide');grid.classList.remove('hide')}function living(r){return S.names.filter((_,i)=>S.alive[i]&&S.deck[i]===r).length}function buildQueue(){S.queue=[];['mafia','doctor','detective'].forEach(r=>{let c=living(r);if(!c)return;if(S.sep[r]&&c>1){for(let i=1;i<=c;i++)S.queue.push({r,num:i,count:c})}else S.queue.push({r,num:null,count:c,together:c>1})});S.q=0}function turnName(t){let s=t.r[0].toUpperCase()+t.r.slice(1);return t.num?s+' number '+t.num:s}function startRound(){stopDay();stopNight();dealScreen.classList.add('hide');table.classList.remove('hide');round.textContent='ROUND '+S.round;S.targets=[];S.saves=[];buildQueue();wait();seq(['Round '+S.round+'.',120,'All right, everybody. Go to bed.'],()=>{crickets();setTimeout(nextTurn,350)})}function nextTurn(){if(S.q>=S.queue.length)return sunrise();let t=S.queue[S.q],n=turnName(t);wait();say(n+', open your eyes.',()=>{let prompt=t.r==='mafia'?(t.together?'All Mafia decide together. Who do you want to eliminate?':'Who do you want to eliminate?'):t.r==='doctor'?(t.together?'All Doctors decide together. Who do you want to save?':'Who do you want to save?'):(t.together?'All Detectives decide together. Who do you want to investigate?':'Who do you want to investigate?');say(prompt,()=>picks(i=>{if(t.r==='mafia')S.targets.push(i);if(t.r==='doctor')S.saves.push(i);if(t.r==='detective'){let yes=S.deck[i]==='mafia';showFlash(yes?'YES':'NO',yes?'That person is the Mafia.':'That person is not the Mafia.');return say(yes?'Yes. That person is the Mafia.':'No. That person is not the Mafia.',()=>setTimeout(()=>{hideFlash();closeTurn()},650))}closeTurn()}))});function closeTurn(){wait();say(n+', close your eyes.',()=>{S.q++;setTimeout(nextTurn,250)})}}function sunrise(){wait();stopNight();let uniq=[...new Set(S.targets)],killed=uniq.filter(i=>!S.saves.includes(i)),saved=uniq.filter(i=>S.saves.includes(i));killed.forEach(i=>S.alive[i]=false);say('All right, everybody, wake up.',()=>{rooster();setTimeout(()=>say('Good morning.',()=>{birds();let a=[];if(!killed.length)a.push('Nobody got eliminated.');else killed.forEach(i=>a.push(S.names[i]+' got eliminated.'));saved.forEach(i=>a.push(150,S.names[i]+' got saved by the Doctor.'));seq(a,()=>setTimeout(dayVote,350))}),900)})}function dayVote(){if(!living('mafia'))return win();wait();say('Okay. Who do you want to eliminate?',()=>picks(i=>{S.alive[i]=false;let m=S.deck[i]==='mafia';showFlash(S.names[i]+' eliminated',m?'That player was Mafia.':'That player was not Mafia.');say(m?'That player was Mafia.':'That player was not Mafia.',()=>setTimeout(()=>{hideFlash();if(!living('mafia'))win();else{S.round++;startRound()}},850))},()=>{wait();say('The vote is tied. Nobody is eliminated. Moving to the next round.',()=>{S.round++;setTimeout(startRound,350)})}))}function showFlash(a,b){fb.textContent=a;fs.textContent=b;actions.classList.add('hide');flash.classList.remove('hide')}function hideFlash(){flash.classList.add('hide')}function win(){stopNight();stopDay();showFlash('TOWN WINS','The Mafia is out.');actions.classList.remove('hide');say('The Mafia is out. The town wins.')}function reset(){stopNight();stopDay();if('speechSynthesis'in window)speechSynthesis.cancel();flash.classList.add('hide');table.classList.add('hide');dealScreen.classList.add('hide');setup.classList.remove('hide');S.round=1}again.onclick=reset;back.onclick=reset;exit.onclick=reset;sync()})();</script></body></html>
