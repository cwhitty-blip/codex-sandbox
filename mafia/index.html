<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07080b"><title>Mafia</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#07080b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}button,textarea{font:inherit;touch-action:manipulation}.w{max-width:700px;margin:auto;padding:14px}.box{background:#11141a;border:1px solid #2a3039;border-radius:18px;padding:18px;margin:10px 0}h1{font-size:52px;margin:5px 0}p{color:#aab0b9}.r{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292e36;padding:12px 0}.r:last-child{border:0}.st{display:flex;align-items:center;gap:7px}.st button{width:44px;height:44px;border:0;border-radius:12px;background:#20252d;color:white;font-size:23px}.n{width:28px;text-align:center;font-weight:900;font-size:21px}.rn{display:flex;align-items:center}.ri{font-size:26px;margin-right:9px}textarea{width:100%;height:110px;background:#090b0f;color:#fff;border:1px solid #303640;border-radius:12px;padding:12px;font-size:16px}.btn{width:100%;min-height:54px;margin-top:9px;border:0;border-radius:13px;background:#242932;color:#fff;font-weight:900}.red{background:#df3b46}.gold{background:#3a301b;color:#ffe0a0}.hide{display:none!important}.deal{min-height:75vh;display:grid;place-items:center;text-align:center}.big{font-size:45px;font-weight:900}.roleline{display:flex;align-items:center;justify-content:center;gap:12px}.pic{font-size:48px}.table{position:fixed;inset:0;background:radial-gradient(circle at 50% 0,#251014,#050608 46%);z-index:9;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.round{font-size:13px;color:#aaa;font-weight:900;letter-spacing:.1em}.x{width:46px;height:46px;border:1px solid #333;border-radius:12px;background:#111;color:#fff;font-size:22px}.center{flex:1;display:grid;place-items:center}.grid{width:100%;max-width:700px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.person{min-height:78px;border:1px solid #343b45;border-radius:16px;background:#151920;color:#fff;font-size:22px;font-weight:900}.orb{width:120px;height:120px;border-radius:50%;background:#11151b;border:1px solid #303640;box-shadow:0 0 55px #4c1118}.bottom{text-align:center}.repeat{width:54px;height:54px;border-radius:50%;border:1px solid #333;background:#12151a;color:#fff}.flash{position:fixed;inset:0;background:#050608;z-index:20;display:grid;place-items:center;text-align:center;padding:20px}.flash b{font-size:58px}.flash p{font-size:20px}.small{font-size:12px;color:#999}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<main class="w" id="setup"><h1>MAFIA</h1><p>Deal the roles. Put the phone in the middle. Let the host run the game.</p><div class="box">
<div class="r"><b>Players</b><div class="st"><button data-p="-1">−</button><span class="n" id="pc">8</span><button data-p="1">+</button></div></div>
<div class="r"><div class="rn"><span class="ri">🥷</span><b>Mafia</b></div><div class="st"><button data-r="mafia" data-d="-1">−</button><span class="n" id="mafia">2</span><button data-r="mafia" data-d="1">+</button></div></div>
<div class="r"><div class="rn"><span class="ri">🧑‍⚕️</span><b>Doctor</b></div><div class="st"><button data-r="doctor" data-d="-1">−</button><span class="n" id="doctor">1</span><button data-r="doctor" data-d="1">+</button></div></div>
<div class="r"><div class="rn"><span class="ri">🕵️‍♀️</span><b>Detective</b></div><div class="st"><button data-r="detective" data-d="-1">−</button><span class="n" id="detective">1</span><button data-r="detective" data-d="1">+</button></div></div>
<p class="small">Player names — one per line</p><textarea id="names" placeholder="Malachi&#10;Asher&#10;Judah&#10;Aria"></textarea>
<button class="btn gold" id="test">🔊 Test sound</button><p class="small">Sound is built in and always on during the game.</p>
<button class="btn red" id="deal">Deal secret roles</button></div></main>
<main class="w hide" id="dealScreen"><button class="btn" id="back">← Setup</button><div class="box deal"><div id="cover"><div class="big" id="who"></div><p>Make sure nobody else can see.</p><button class="btn red" id="reveal">Reveal my role</button></div><div id="role" class="hide"><div class="roleline"><span class="pic" id="rolePic"></span><div class="big" id="roleName"></div></div><p id="roleDesc"></p><button class="btn red" id="pass">Hide & pass phone</button></div></div></main>
<section id="table" class="table hide"><div class="top"><span class="round" id="roundLabel">ROUND 1</span><button class="x" id="exit">×</button></div><div class="center"><div id="orb" class="orb"></div><div id="grid" class="grid hide"></div></div><div class="bottom"><button class="repeat" id="repeat">🔊</button></div></section>
<section id="flash" class="flash hide"><div><b id="flashBig"></b><p id="flashSmall"></p></div></section>
<script>
(()=>{const $=x=>document.getElementById(x),S={p:8,r:{mafia:2,doctor:1,detective:1},names:[],deck:[],i:0,alive:[],m:null,d:null,v:[],last:'',music:true,round:1};const I={mafia:['🥷','MAFIA','Wake with the Mafia and choose someone to eliminate.'],doctor:['🧑‍⚕️','DOCTOR','Choose someone to protect.'],detective:['🕵️‍♀️','DETECTIVE','Investigate someone. The phone will answer you.'],villager:['🧑','VILLAGER','Stay asleep at night. Help find the Mafia during the day.']};function upd(){$('pc').textContent=S.p;for(const k in S.r)$(k).textContent=S.r[k]}document.onclick=e=>{let b=e.target.closest('[data-p]');if(b){S.p=Math.max(5,Math.min(24,S.p+ +b.dataset.p));upd()}b=e.target.closest('[data-r]');if(b){let k=b.dataset.r,min=k==='mafia'?1:0;S.r[k]=Math.max(min,S.r[k]+ +b.dataset.d);upd()}};function load(){if(!('speechSynthesis'in window))return;S.v=speechSynthesis.getVoices()}if('speechSynthesis'in window){load();speechSynthesis.onvoiceschanged=load;setTimeout(load,500)}function voice(){for(const n of['Ava','Samantha','Serena','Victoria','Karen','Tessa','Moira']){let v=S.v.find(x=>x.name.includes(n)&&/^en/i.test(x.lang));if(v)return v}return S.v.find(x=>/^en-US/i.test(x.lang))||S.v.find(x=>/^en/i.test(x.lang))}
let ac,master,jazzGain,fxGain,jazzTimer,phase='none',ambientTimers=[],jazzStep=0;function audio(){if(ac)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A();master=ac.createGain();master.gain.value=.18;master.connect(ac.destination);jazzGain=ac.createGain();jazzGain.gain.value=.42;jazzGain.connect(master);fxGain=ac.createGain();fxGain.gain.value=.72;fxGain.connect(master)}function resumeAudio(){audio();if(!ac)return;if(ac.state==='suspended')ac.resume();if(!jazzTimer)startJazz()}function oscTo(dest,f,t,d,g,type='sine'){const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(g,t+.02);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(dest);o.start(t);o.stop(t+d+.03)}function startJazz(){if(!ac)return;const t=ac.currentTime+.03;const chords=[[130.81,164.81,196,233.08],[146.83,174.61,220,261.63],[110,138.59,164.81,207.65],[123.47,155.56,185,220]],C=chords[jazzStep++%chords.length];C.forEach((f,i)=>oscTo(jazzGain,f,t,2.8,.045/(i+1),'sine'));[C[0]/2,C[0]*.75,C[0]/2,C[0]*.84].forEach((f,i)=>oscTo(jazzGain,f,t+i*.68,.36,.065,'triangle'));[0,1,2,3].forEach(i=>oscTo(jazzGain,1046.5,t+i*.68+.34,.045,.007,'sine'));jazzTimer=setTimeout(()=>{jazzTimer=null;startJazz()},2680)}function clearAmbient(){ambientTimers.forEach(clearTimeout);ambientTimers=[]}function cricketBurst(){if(!ac||phase!=='night')return;const t=ac.currentTime+.02,base=3600+Math.random()*900;for(let i=0;i<6;i++)oscTo(fxGain,base+i*28,t+i*.07,.035,.02,'square');ambientTimers.push(setTimeout(cricketBurst,520+Math.random()*700))}function birdChirp(delay=0){if(!ac||phase!=='day')return;const t=ac.currentTime+delay,f=1500+Math.random()*1200;oscTo(fxGain,f,t,.09,.032,'sine');oscTo(fxGain,f*1.17,t+.10,.07,.022,'sine')}function birdsLoop(){if(!ac||phase!=='day')return;birdChirp(.02);if(Math.random()>.35)birdChirp(.28);if(Math.random()>.7)birdChirp(.52);ambientTimers.push(setTimeout(birdsLoop,650+Math.random()*1100))}function startNightAmbience(){resumeAudio();clearAmbient();phase='night';fxGain.gain.setTargetAtTime(.78,ac.currentTime,.05);cricketBurst()}function roosterCrow(cb){resumeAudio();clearAmbient();phase='sunrise';const t=ac.currentTime+.05;[430,520,610,700,640,560,470].forEach((f,i)=>oscTo(fxGain,f,t+i*.14,.24,.075,'sawtooth'));[215,260,305].forEach((f,i)=>oscTo(fxGain,f,t+i*.23,.62,.034,'triangle'));ambientTimers.push(setTimeout(()=>{phase='day';birdsLoop();cb&&cb()},1450))}function startDayAmbience(){resumeAudio();clearAmbient();phase='day';birdsLoop()}function duck(on){if(!ac)return;master.gain.setTargetAtTime(on?.11:.18,ac.currentTime,.06)}function say(t,c){S.last=t;if(!('speechSynthesis'in window)){c&&c();return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.91;u.pitch=1.04;u.volume=1;let v=voice();if(v)u.voice=v;duck(true);let done=false,f=()=>{if(done)return;done=true;duck(false);c&&c()};u.onend=f;u.onerror=f;speechSynthesis.speak(u)}function seq(a,c){let i=0;(function n(){if(i>=a.length)return c&&c();let z=a[i++];typeof z==='number'?setTimeout(n,z):say(z,n)})()}$('test').onclick=()=>{resumeAudio();startNightAmbience();seq(['All right, everyone.',220,'Sound is on.',180,'Your host is ready.'])};$('repeat').onclick=()=>{resumeAudio();S.last&&say(S.last)};function names(){let a=$('names').value.split(/\n/).map(x=>x.trim()).filter(Boolean);while(a.length<S.p)a.push('Player '+(a.length+1));return a.slice(0,S.p)}function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}$('deal').onclick=()=>{resumeAudio();startNightAmbience();let q=S.r.mafia+S.r.doctor+S.r.detective;if(q>S.p)return alert('Too many roles.');S.names=names();S.deck=[];for(let k in S.r)for(let i=0;i<S.r[k];i++)S.deck.push(k);while(S.deck.length<S.p)S.deck.push('villager');sh(S.deck);S.alive=S.names.map(()=>1);S.i=0;S.round=1;rd();$('setup').classList.add('hide');$('dealScreen').classList.remove('hide')};function rd(){$('who').textContent=S.names[S.i];$('cover').classList.remove('hide');$('role').classList.add('hide')}$('reveal').onclick=()=>{resumeAudio();let x=I[S.deck[S.i]];$('rolePic').textContent=x[0];$('roleName').textContent=x[1];$('roleDesc').textContent=x[2];$('cover').classList.add('hide');$('role').classList.remove('hide');$('pass').textContent=S.i===S.p-1?'Start Game':'Hide & pass phone'};$('pass').onclick=()=>{resumeAudio();if(++S.i>=S.p)startRound();else rd()};$('back').onclick=()=>{$('dealScreen').classList.add('hide');$('setup').classList.remove('hide')};function wait(){$('grid').classList.add('hide');$('orb').classList.remove('hide')}function picks(f){let g=$('grid');g.innerHTML='';S.names.forEach((n,i)=>{if(!S.alive[i])return;let b=document.createElement('button');b.className='person';b.textContent=n;b.onclick=()=>{resumeAudio();f(i)};g.appendChild(b)});$('orb').classList.add('hide');g.classList.remove('hide')}function startRound(){startNightAmbience();$('dealScreen').classList.add('hide');$('table').classList.remove('hide');$('roundLabel').textContent='ROUND '+S.round;S.m=S.d=null;wait();seq(['Round '+S.round+'.',180,'All right, everyone.',180,'It is time to sleep.',250,'Close your eyes.'],()=>setTimeout(mafia,420))}function livingRole(role){return S.names.some((_,i)=>S.alive[i]&&S.deck[i]===role)}function mafia(){if(!livingRole('mafia'))return townWins();wait();seq(['Mafia, open your eyes.',250,'Who do you want to eliminate?'],()=>picks(i=>{S.m=i;wait();seq(['Got it.',150,'Mafia, close your eyes.'],()=>setTimeout(doctor,420))}))}function doctor(){if(!livingRole('doctor'))return detective();wait();seq(['Doctor, open your eyes.',250,'Who do you want to save?'],()=>picks(i=>{S.d=i;wait();seq(['Good choice.',150,'Doctor, close your eyes.'],()=>setTimeout(detective,420))}))}function detective(){if(!livingRole('detective'))return sunrise();wait();seq(['Detective, open your eyes.',250,'Who do you want to accuse?'],()=>picks(i=>{wait();let y=S.deck[i]==='mafia';flash(y?'YES':'NO',y?'That person is the Mafia.':'That person is not the Mafia.');say(y?'Yes. That person is the Mafia.':'No. That person is not the Mafia.',()=>setTimeout(()=>{unflash();say('Detective, close your eyes.',()=>setTimeout(sunrise,420))},750))}))}function sunrise(){wait();let k=S.m!==null&&S.m!==S.d?S.m:null,s=livingRole('doctor')&&S.d!==null?S.d:null;if(k!==null)S.alive[k]=0;roosterCrow(()=>{let a=['Everyone, open your eyes.',300,'Good morning.',220,'All right. This is what happened.',250,k===null?'Nobody got eliminated.':S.names[k]+' got eliminated.'];if(s!==null){a.push(220,S.names[s]+' got saved by the Doctor.');if(S.m===s)a.push(180,'The Doctor stopped the Mafia.')}seq(a,()=>{flash(k===null?'Nobody eliminated':S.names[k]+' eliminated',s!==null?S.names[s]+' was saved by the Doctor.':'The day begins.');setTimeout(()=>{unflash();checkAfterNight()},2200)})})}function checkAfterNight(){if(!livingRole('mafia'))return townWins();if(mafiaMajority())return mafiaWins();dayVote()}function dayVote(){startDayAmbience();wait();seq(['Okay, everyone.',220,'Who do you want to eliminate?'],()=>picks(i=>{wait();S.alive[i]=0;let mafia=S.deck[i]==='mafia';flash(S.names[i]+' eliminated',mafia?'That player was Mafia.':'That player was not Mafia.');seq([S.names[i]+' has been eliminated.',240,mafia?'That player was Mafia.':'That player was not Mafia.'],()=>setTimeout(()=>{unflash();if(!livingRole('mafia'))townWins();else if(mafiaMajority())mafiaWins();else{S.round++;startRound()}},1000))}))}function mafiaMajority(){let m=0,t=0;S.names.forEach((_,i)=>{if(S.alive[i]){t++;if(S.deck[i]==='mafia')m++}});return m>0&&m>=t-m}function townWins(){wait();flash('TOWN WINS','The Mafia is out!');seq(['The Mafia is out.',260,'The town wins!'],()=>{})}function mafiaWins(){wait();flash('MAFIA WINS','The Mafia has taken over.');seq(['The Mafia wins.',220,'Game over.'],()=>{})}function flash(a,b){$('flashBig').textContent=a;$('flashSmall').textContent=b;$('flash').classList.remove('hide')}function unflash(){$('flash').classList.add('hide')}$('exit').onclick=()=>{speechSynthesis.cancel();clearAmbient();phase='none';$('table').classList.add('hide');$('setup').classList.remove('hide')};upd()})();</script></body></html>
