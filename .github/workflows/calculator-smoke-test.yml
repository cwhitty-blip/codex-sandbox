name: Calculator smoke test

on:
  push:
    branches: [main]
    paths:
      - 'calculator/**'
      - 'calculator-v*.html'
      - 'calculator-v*.webmanifest'
      - 'calculator-v*-sw.js'
      - '.github/scripts/calculator-smoke-test.mjs'
      - '.github/scripts/calculator-call-test.mjs'
      - '.github/scripts/calculator-180-checks.mjs'
      - '.github/workflows/calculator-smoke-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 > /tmp/calculator-http.log 2>&1 &
          echo $! > /tmp/calculator-http.pid
          sleep 2
          curl --fail http://127.0.0.1:4173/calculator/ >/dev/null

      - name: Run unlock and app test
        run: node .github/scripts/calculator-smoke-test.mjs

      - name: Run two-phone call test
        run: node .github/scripts/calculator-call-test.mjs
