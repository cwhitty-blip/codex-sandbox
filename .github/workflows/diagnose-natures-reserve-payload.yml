name: Publish Nature Reserve preview site

on:
  push:
    paths:
      - ".github/workflows/diagnose-natures-reserve-payload.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore the approved preview build
        shell: bash
        run: |
          set -euo pipefail

          sed -n "/<<'B64'/,/^[[:space:]]*B64[[:space:]]*$/p" .github/workflows/capture-natures-reserve.yml \
            | sed '1d;$d;s/^[[:space:]]*//' \
            > /tmp/natures-reserve-site.b64

          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/natures-reserve-site.b64')
          lines = [line.strip() for line in path.read_text().splitlines() if line.strip()]
          if len(lines) != 220:
              raise SystemExit(f'Unexpected payload line count: {len(lines)}')

          replacements = {
              44: 'wLUSSkBwMGtzfEfagIgnetDfBaggoOECC8rAIcTAVJbncAPQEXOPz7BOGRDCCVRxPDskl3aUYp/1',
              45: 'uIpxAB49j+B2Kp7ED038NJerFjf9xZ/+s3CDagD/b5Sb/NNay3iZu0ns6RwSnz0SUwyVS4xwcLgq',
              97: 'sxQNizFlYrqvdaIOzEvxmbZyUhN8pTDrdaxWnMVXa8yJ87nNi01d5iK5CrVbTebwa3X0LoJxH/La',
          }
          for line_number, value in replacements.items():
              lines[line_number - 1] = value

          path.write_text('\n'.join(lines) + '\n')
          PY

          base64 --decode /tmp/natures-reserve-site.b64 > /tmp/natures-reserve-site.tar.gz
          echo "31243d2c6636999b109ef0b2701b65434cab11c3e9b48170494b4ec6d9bbb7e7  /tmp/natures-reserve-site.tar.gz" | sha256sum --check -

          rm -rf natures-reserve-preview
          mkdir -p natures-reserve-preview
          tar -xzf /tmp/natures-reserve-site.tar.gz -C natures-reserve-preview
          touch natures-reserve-preview/.nojekyll

          test -s natures-reserve-preview/index.html
          test -s natures-reserve-preview/styles.css
          test -s natures-reserve-preview/script.js
          grep -q "Nature's Reserve" natures-reserve-preview/index.html

      - name: Save preview files to the repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add natures-reserve-preview
          if git diff --cached --quiet; then
            echo "Preview files are already current."
          else
            git commit -m "Publish Nature Reserve client preview"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
